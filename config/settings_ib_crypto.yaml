acceptance:
  consecutive_closes: 2
  min_distance_atr: 0.25
asset_classes:
  crypto:
    commission_bps: 25
    session_close_local: '23:59'
    session_open_local: '00:00'
    slippage_bps: 5
    symbols:
    - BTC/USD
    - ETH/USD
    - SOL/USD
    - AVAX/USD
    - LINK/USD
    - ADA/USD
    - DOGE/USD
    - DOT/USD
    - PEPE/USD
    - XRP/USD
    timezone: UTC
backtest:
  cache_dir: runtime/bars_cache
  end: '2026-04-30'
  initial_equity: 100000
  start: '2024-01-01'
broker:
  handshake_symbol: BTC/USD
  paper_trading: true
filters:
  opening_blackout_min: 0
  volume_deficit_pct: 0.3
logging:
  level: INFO
  log_file: logs/ib_crypto_trader.log
news_blackouts: []
overrides:
  enabled: false
position_management:
  breakeven_at_R: 1.0
  max_hold_bars: 24
  trail_at_R: 1.5
  trail_atr: 1.0
risk:
  consecutive_loss_limit: 3
  loss_filter_scope: per_symbol
  max_concurrent_positions: 3
  max_daily_risk_open: 0.03
  max_notional_per_trade_pct: 0.15
  max_risk_per_trade: 0.008
scheduler:
  bar_timeframe: 1Hour
  poll_fallback_seconds: 60
  wake_grace_seconds: 5
setups:
  initial_balance:
    atr_mult_stop: 1.25
    enabled: true
    ib_bars: 3
    target_R: 2.0
system:
  name: ib_crypto_trader
  trading_env: paper
  version: 2.0.0
vwap:
  min_session_bars: 6
  sigma_bands: 1.0