acceptance:
  consecutive_closes: 1
  min_distance_atr: 0.15
asset_classes:
  equity:
    commission_per_share: 0.0
    session_close_local: '16:00'
    session_open_local: '09:30'
    slippage_bps: 2
    # Curated from docs/sweeps/2026-06-04 (russell-1000 sweep). 36 symbols
    # surviving OOS Sharpe >= 0.3 AND >= 10 OOS trades. Previous universe
    # (SPY/QQQ/AAPL/MSFT/NVDA/TSLA/...) had zero overlap with the survivors.
    symbols:
    - MAS
    - KLAC
    - TTWO
    - MLM
    - DG
    - NTRS
    - APD
    - WAB
    - SBAC
    - BDX
    - PAYX
    - NWS
    - MAR
    - FITB
    - PG
    - WM
    - ADSK
    - WEC
    - LRCX
    - CHTR
    - WYNN
    - CDNS
    - NTAP
    - WRB
    - MMC
    - MCHP
    - WCN
    - ADBE
    - ADP
    - KMB
    - SYY
    - SYK
    - BA
    - IBKR
    - TDY
    - DASH
    timezone: America/New_York
backtest:
  cache_dir: runtime/bars_cache
  end: '2026-04-30'
  initial_equity: 100000
  start: '2024-01-01'
broker:
  handshake_symbol: SPY
  paper_trading: true
filters:
  opening_blackout_min: 15
  volume_deficit_pct: 0.3
logging:
  level: INFO
  log_file: logs/vwap_bands_equity_trader.log
news_blackouts: []
overrides:
  enabled: true
  path: runtime/wfo/active/live_overrides.yaml
position_management:
  breakeven_at_R: 1.0
  max_hold_bars: 12
  trail_at_R: 1.5
  trail_atr: 1.0
regime_detector:
  balance_day_in_value_min: 0.6
  trend_day_in_value_max: 0.3
  trend_day_range_mult: 1.5
risk:
  consecutive_loss_limit: 2
  loss_filter_scope: per_symbol
  max_concurrent_positions: 4
  max_daily_risk_open: 0.02
  max_notional_per_trade_pct: 0.1
  max_risk_per_trade: 0.005
scheduler:
  bar_timeframe: 5Min
  poll_fallback_seconds: 60
  wake_grace_seconds: 5
setups:
  vwap_dev_bands:
    # Tuned via docs/sweeps/2026-06-04 (russell-1000 sweep). Best combo by
    # symbols_above_floor + median_oos_sharpe + total_oos_pnl across the
    # curated universe above.
    # Prior values: atr_mult_stop=0.75, sigma=2.5, target_R=2.0.
# 2026-08-07: atr_mult_stop 0.5→0.75→1.0. After 0.5→0.75 on Aug 6,
# 4/6 in-session trades still bars_held=0 (immediate noise stop-out).
# Widening to 1.0 for full 1.0x ATR breathing room.
    atr_mult_stop: 1.0
    enabled: true
    sigma: 2.0
    target_R: 1.5
system:
  name: vwap_bands_equity_trader
  trading_env: paper
  version: 2.0.0
vwap:
  min_session_bars: 6
  sigma_bands: 1.0
