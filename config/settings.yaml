# VWAP Wave Protocol — system configuration
# Phase 5 schema. The bar-close scheduler boots from these keys.

system:
  name: vwap_wave
  version: "1.0.0"
  trading_env: paper          # paper | live | test

logging:
  level: INFO
  log_file: logs/vwap_wave.log

scheduler:
  bar_timeframe: 5Min
  wake_grace_seconds: 5

asset_classes:
  equity:
    timezone: America/New_York
    session_open_local: "09:30"
    session_close_local: "16:00"
    slippage_bps: 1.0
    commission_per_share: 0.0
    commission_bps: 0.0
    symbols:
      - SPY
      - QQQ
      - AAPL
      - MSFT
      - NVDA
  crypto:
    timezone: UTC
    session_open_local: "00:00"
    session_close_local: "23:59"
    slippage_bps: 5.0
    commission_per_share: 0.0
    commission_bps: 25.0
    symbols:
      - BTC/USD
      - ETH/USD

filters:
  opening_blackout_min: 15
  volume_deficit_pct: 0.30

risk:
  max_risk_per_trade: 0.005          # fraction of equity per trade
  max_notional_per_trade_pct: 0.20   # 20 % of equity max single notional
  consecutive_loss_limit: 2
  loss_filter_scope: per_symbol      # per_symbol | system
  max_concurrent_positions: 4
  max_daily_risk_open: 0.02          # 2 % of equity in open risk
  circuit_breaker:
    daily_loss_limit_1: 0.02         # L1: halve sizes at -2 %
    daily_loss_limit_2: 0.03         # L2: halt at -3 %
    drawdown_limit: 0.10             # L3: lock-file at -10 % peak-to-valley

position_management:
  max_hold_bars: 12                  # ~60 min on 5Min bars
  breakeven_at_R: 1.0

setups:
  price_discovery:
    enabled: true
    atr_mult_stop: 1.0
    target_R: 1.5
    arm_window_bars: 6
    cooldown_bars: 12
  fade_extreme:
    enabled: true
    atr_mult_stop: 0.75
    scale_offsets_atr: [0.0, 0.25, 0.5]
    scale_weights:    [0.4, 0.35, 0.25]
    cooldown_bars: 12
  return_to_value:
    enabled: true
    atr_mult_stop: 1.0
    arm_window_bars: 6
    cooldown_bars: 12
  vwap_bounce:
    enabled: true
    atr_mult_stop: 1.25
    target_R: 2.0
    arm_window_bars: 4
    cooldown_bars: 12

backtest:
  cache_dir: runtime/bars_cache

news_blackouts: []
# Example:
#   - start: "2026-05-15T12:30:00+00:00"
#     duration_min: 30
#     label: CPI release
