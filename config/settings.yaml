# regime_trader system configuration

system:
  name: regime_trader
  version: "1.0.0"
  trading_env: paper  # paper | live

tickers:
  primary:
    - SPY
    - QQQ
    - IWM
  watchlist:
    - AAPL
    - NVDA
    - MSFT

hmm:
  min_regimes: 3
  max_regimes: 7
  n_iter: 100
  covariance_type: full
  train_days: 504   # 2 years of daily data
  feature_window: 20  # rolling window for volatility

strategy:
  max_risk_per_trade: 0.01
  leverage_bull: 1.25
  uncertainty_threshold: 4  # regime changes per 20 bars

risk:
  daily_loss_limit_1: 0.02
  daily_loss_limit_2: 0.03
  drawdown_limit: 0.10

backtest:
  train_days: 252
  test_days: 126
  slippage_bps: 5.0
  commission_bps: 2.0

broker:
  paper_trading: true
  handshake_symbol: NVDA

logging:
  level: INFO
  log_file: logs/regime_trader.log

portfolio:
  rebalance_threshold: 0.05   # rebalance when any asset drifts >5% from target
  max_single_asset: 0.40      # hard cap: no asset may exceed 40% of portfolio
  assets:
    - ticker: SPY
      name: "S&P 500 ETF"
      asset_class: equity
      target_weight: 0.40
      min_weight: 0.10
      max_weight: 0.60
    - ticker: QQQ
      name: "Nasdaq 100 ETF"
      asset_class: equity
      target_weight: 0.30
      min_weight: 0.05
      max_weight: 0.50
    - ticker: IWM
      name: "Russell 2000 ETF"
      asset_class: equity
      target_weight: 0.20
      min_weight: 0.00
      max_weight: 0.40
    - ticker: GLD
      name: "Gold ETF"
      asset_class: commodity
      target_weight: 0.10
      min_weight: 0.00
      max_weight: 0.25
