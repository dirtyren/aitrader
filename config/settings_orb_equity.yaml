acceptance:
  consecutive_closes: 1
  min_distance_atr: 0.15
asset_classes:
  equity:
    commission_per_share: 0.0
    session_close_local: '16:00'
    session_open_local: '09:30'
    slippage_bps: 2
    # 2026-07-14: Trimmed from 48 to 8 high-vol symbols per skill guidance.
    # Breakout strategies need high-vol, high-liquidity names to generate
    # meaningful ranges. 48 low-vol symbols = diluted signals, 0% fill rate.
    # Focusing on highest ATR names from the original list.
    symbols:
    - UAL
    - DAL
    - SOFI
    - EXPE
    - WYNN
    - CRM
    - MPC
    - NEM
    timezone: America/New_York
backtest:
  cache_dir: runtime/bars_cache
  end: '2026-04-30'
  initial_equity: 100000
  start: '2024-01-01'
broker:
  handshake_symbol: SPY
  paper_trading: true
filters:
  opening_blackout_min: 15
  volume_deficit_pct: 0.3
logging:
  level: INFO
  log_file: logs/orb_equity_trader.log
news_blackouts: []
overrides:
  enabled: true
  path: runtime/wfo/active/live_overrides.yaml
position_management:
  breakeven_at_R: 1.0
  max_hold_bars: 12
  trail_at_R: 1.5
  trail_atr: 1.0
regime_detector:
  balance_day_in_value_min: 0.6
  trend_day_in_value_max: 0.3
  trend_day_range_mult: 1.5
risk:
  consecutive_loss_limit: 2
  loss_filter_scope: per_symbol
  max_concurrent_positions: 4
  max_daily_risk_open: 0.02
  max_notional_per_trade_pct: 0.10
  max_risk_per_trade: 0.005
scheduler:
  bar_timeframe: 5Min
  poll_fallback_seconds: 60
  wake_grace_seconds: 5
setups:
  orb_vwap:
    # Tuned via docs/sweeps/2026-06-04 (russell-1000 sweep). Best combo by
    # symbols_above_floor + median_oos_sharpe + total_oos_pnl.
    # Prior values: atr_mult_stop=0.75, orb_bars=6, target_R=3.0.
    # 2026-07-14: No param changes — 48→8 symbol trim is the one-var change
    # for this cycle. All 30 prior trades were $0 PnL (29/30 manual_close or
    # entry_never_filled). Fewer, higher-vol names should concentrate signals.
    atr_mult_stop: 0.75
    enabled: true
    orb_bars: 4
    target_R: 4.0
system:
  name: orb_equity_trader
  trading_env: paper
  version: 2.0.0
vwap:
  min_session_bars: 6
  sigma_bands: 1.0
