acceptance:
  consecutive_closes: 1
  min_distance_atr: 0.15
asset_classes:
  equity:
    commission_per_share: 0.0
    session_close_local: '16:00'
    session_open_local: '09:30'
    slippage_bps: 2
    # Curated from docs/sweeps/2026-06-04 (russell-1000 sweep). 48 symbols
    # surviving OOS Sharpe >= 0.3 AND >= 10 OOS trades at the chosen combo.
    # Previous universe (SPY/QQQ/IWM/NVDA/TSLA/META) had zero overlap with
    # the survivors and is replaced wholesale.
    symbols:
    - STLD
    - MAR
    - LDOS
    - TECH
    - HES
    - EFX
    - AXP
    - UAL
    - SOFI
    - PNR
    - RVTY
    - KEYS
    - ZTS
    - ETN
    - NEM
    - MPC
    - EXPE
    - REGN
    - FAST
    - IRM
    - NSC
    - WYNN
    - J
    - CRM
    - TRV
    - ODFL
    - L
    - ALL
    - PHM
    - GRMN
    - FDX
    - EIX
    - GPC
    - MAA
    - VEEV
    - MTCH
    - DAL
    - HUM
    - WELL
    - TROW
    - HLT
    - ICE
    - TT
    - ESS
    - MHK
    - SUI
    - LHX
    - MLM
    timezone: America/New_York
backtest:
  cache_dir: runtime/bars_cache
  end: '2026-04-30'
  initial_equity: 100000
  start: '2024-01-01'
broker:
  handshake_symbol: SPY
  paper_trading: true
filters:
  opening_blackout_min: 15
  volume_deficit_pct: 0.3
logging:
  level: INFO
  log_file: logs/orb_equity_trader.log
news_blackouts: []
overrides:
  enabled: true
  path: runtime/wfo/active/live_overrides.yaml
position_management:
  breakeven_at_R: 1.0
  max_hold_bars: 12
  trail_at_R: 1.5
  trail_atr: 1.0
regime_detector:
  balance_day_in_value_min: 0.6
  trend_day_in_value_max: 0.3
  trend_day_range_mult: 1.5
risk:  consecutive_loss_limit: 2
  loss_filter_scope: per_symbol
  max_concurrent_positions: 4
  max_daily_risk_open: 0.02
  max_notional_per_trade_pct: 0.10
  max_risk_per_trade: 0.005
scheduler:
  bar_timeframe: 5Min
  poll_fallback_seconds: 60
  wake_grace_seconds: 5
setups:
  orb_vwap:
    # Tuned via docs/sweeps/2026-06-04 (russell-1000 sweep). Best combo by
    # symbols_above_floor + median_oos_sharpe + total_oos_pnl.
    # Prior values: atr_mult_stop=0.75, orb_bars=6, target_R=3.0.
    atr_mult_stop: 0.5
    enabled: true
    orb_bars: 3
    target_R: 4.0
system:
  name: orb_equity_trader
  trading_env: paper
  version: 2.0.0
vwap:
  min_session_bars: 6
  sigma_bands: 1.0
