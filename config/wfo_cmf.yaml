# Walk-Forward Optimization — CMF strategy on GLD (gold)
# 5-year history, 3mo IS / 9mo OOS sliding windows

run:
  output_root: runtime/wfo
  random_seed: 42
  parallelism: -1

history:
  start: "2021-06-12"
  end: "2026-06-12"
  initial_equity: 100000

windowing:
  in_sample: "3mo"
  out_of_sample: "9mo"
  step: null

universe:
  source: symbols
  symbols:
    - GLD

timeframes:
  - 15Min
  - 1Hour

fitness:
  metric: sharpe
  min_trades: 5

gate:
  wfe_min: 0.3
  require_positive_oos_pnl: true

grid:
  cmf:
    enabled: [true]
    period: [14, 20, 30]
    threshold: [0.05, 0.10, 0.15]
    atr_mult_stop: [0.5, 0.75, 1.0]
    target_R: [1.5, 2.0, 2.5]
    cooldown_bars: [6]

position_management:
  max_hold_bars: [8, 12, 16]
  breakeven_at_R: [0.75, 1.0, 1.25]
