system:
  name: vwap_wave_equity_trader
  version: "2.0.0"
  trading_env: paper            # paper | live | backtest

scheduler:
  bar_timeframe: "5Min"
  wake_grace_seconds: 5
  poll_fallback_seconds: 60

vwap:
  sigma_bands: 1.5
  min_session_bars: 6

acceptance:
  consecutive_closes: 1
  min_distance_atr: 0.20

regime_detector:
  trend_day_range_mult: 1.5
  trend_day_in_value_max: 0.30
  balance_day_in_value_min: 0.60

setups:
  price_discovery:
    enabled: true
    atr_mult_stop: 1.0
    target_R: 2.0
    arm_window_bars: 4
    cooldown_bars: 12
  fade_extreme:
    enabled: true
    atr_mult_stop: 0.75
    scale_weights: [0.3, 0.4, 0.30]
    scale_offsets_atr: [0.0, 0.25, 0.50]
    target: vwap
    cooldown_bars: 12
  return_to_value:
    enabled: true
    atr_mult_stop: 1.0
    target: vwap
    arm_window_bars: 6
    cooldown_bars: 12
  vwap_bounce:
    enabled: true
    atr_mult_stop: 1.25
    target_R: 2.5
    arm_window_bars: 6
    cooldown_bars: 8

risk:
  max_risk_per_trade: 0.005
  max_notional_per_trade_pct: 0.10
  max_concurrent_positions: 4
  max_daily_risk_open: 0.02
  consecutive_loss_limit: 2
  loss_filter_scope: per_symbol
  circuit_breaker:
    daily_loss_limit_1: 0.015
    daily_loss_limit_2: 0.025
    drawdown_limit: 0.05

filters:
  opening_blackout_min: 15
  volume_deficit_pct: 0.30

position_management:
  max_hold_bars: 12
  breakeven_at_R: 1.0
  trail_at_R: 1.5
  trail_atr: 1.0

asset_classes:
  equity:
    timezone: "America/New_York"
    session_open_local: "09:30"
    session_close_local: "16:00"
    slippage_bps: 2
    commission_per_share: 0.0
    symbols:
      - SPY
      - QQQ
      - IWM
      - XLF
      - XLE
      - AAPL
      - MSFT
      - NVDA
      - TSLA
      - AMZN
      - GOOGL
      - META
      - AMD
      - JPM
      - AVGO
      - NFLX
      - COIN
      - PLTR
      - UBER

news_blackouts: []

backtest:
  start: "2024-01-01"
  end: "2026-04-30"
  initial_equity: 100000
  cache_dir: "runtime/bars_cache"

broker:
  paper_trading: true
  handshake_symbol: SPY

logging:
  level: INFO
  log_file: logs/vwap_wave_equity_trader.log

overrides:
  path: runtime/wfo/active/live_overrides.yaml
  enabled: true
