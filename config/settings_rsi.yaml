system:
  name: rsi_trader
  version: 2.0.0
  trading_env: paper
scheduler:
  bar_timeframe: 1H
  wake_grace_seconds: 5
  poll_fallback_seconds: 60
vwap:
  sigma_bands: 1.0
  min_session_bars: 6
acceptance:
  consecutive_closes: 2
  min_distance_atr: 0.25
regime_detector:
  trend_day_range_mult: 1.5
  trend_day_in_value_max: 0.3
  balance_day_in_value_min: 0.6
setups:
  rsi_reversion:
    enabled: true
    threshold: 35
    direction: long
    stop_loss_pct: 2.0
    position_size_r: 0.5
    period: 5
risk:
  max_risk_per_trade: 0.005
  max_notional_per_trade_pct: 0.2
  max_concurrent_positions: 4
  max_daily_risk_open: 0.02
  consecutive_loss_limit: 2
  loss_filter_scope: per_symbol
  circuit_breaker:
    daily_loss_limit_1: 0.015
    daily_loss_limit_2: 0.025
    drawdown_limit: 0.05
filters:
  opening_blackout_min: 15
  volume_deficit_pct: 0.3
position_management:
  max_hold_bars: 12
  breakeven_at_R: 1.0
  trail_at_R: 1.5
  trail_atr: 1.0
asset_classes:
  equity:
    timezone: America/New_York
    session_open_local: '00:00'
    session_close_local: '23:59'
    slippage_bps: 2
    commission_per_share: 0.0
    symbols:
    - SPY
    - QQQ
    - IWM
    - XLF
    - GLD
    - AAPL
    - MSFT
    - NVDA
    - JPM
    - NFLX
    - COIN
    - PLTR
    - UBER
  crypto:
    timezone: UTC
    session_open_local: 00:00
    session_close_local: '23:59'
    slippage_bps: 5
    commission_bps: 25
    symbols:
    - BTC/USD
    - ETH/USD
news_blackouts: []
backtest:
  start: '2024-01-01'
  end: '2026-04-30'
  initial_equity: 100000
  cache_dir: runtime/bars_cache
broker:
  paper_trading: true
  handshake_symbol: SPY
logging:
  level: INFO
  log_file: logs/rsi_trader.log
overrides:
  path: runtime/wfo/active/live_overrides.yaml
  enabled: true
