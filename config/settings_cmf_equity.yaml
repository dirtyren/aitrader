system:
  name: cmf_equity_trader
  version: "1.1.0"
  trading_env: paper

scheduler:
  bar_timeframe: 15Min
  wake_grace_seconds: 5
  poll_fallback_seconds: 60

vwap:
  sigma_bands: 1.5
  min_session_bars: 6

acceptance:
  consecutive_closes: 1
  min_distance_atr: 0.15

regime_detector:
  trend_day_range_mult: 1.5
  trend_day_in_value_max: 0.3
  balance_day_in_value_min: 0.6

setups:
  cmf:
    # WFO-optimized 2026-06-12: 5yr sweep across 15 top equities.
    # 100% pass rate (15/15), mean WFE=0.67, mean OOS Sharpe=3.33.
    # Prior values (GLD-only): period=20 threshold=0.10 atr_mult_stop=0.5 target_R=1.5.
    enabled: true
    period: 20
    threshold: 0.15
    atr_mult_stop: 1.0
    target_R: 2.5

risk:
  max_risk_per_trade: 0.005
  # 2026-07-14: raised 0.10→0.30 to fix "sized to zero" problem.
  # At ~$2K equity, 0.10=$203 cap made 8/15 symbols untradeable
  # (1 share exceeds cap). 0.30=$609 covers all but SPY/QQQ/META
  # which are now dropped from the symbol list.
  max_notional_per_trade_pct: 0.30
  max_concurrent_positions: 4
  max_daily_risk_open: 0.02
  consecutive_loss_limit: 2
  loss_filter_scope: per_symbol
filters:
  opening_blackout_min: 15
  volume_deficit_pct: 0.3

position_management:
  # WFO-optimal: max_hold_bars=12, breakeven_at_R=1.0.
  max_hold_bars: 12
  breakeven_at_R: 1.0
  trail_at_R: 1.5
  trail_atr: 1.0

asset_classes:
  equity:
    timezone: America/New_York
    # 2026-07-14: session_open changed from 00:00 to 09:30.
    # Polling for 9.5 hours before market open burned Alpaca free-tier
    # rate limits with no benefit. Market hours only.
    session_open_local: '09:30'
    session_close_local: '16:00'
    slippage_bps: 2
    commission_per_share: 0.0
    # 2026-07-14: Dropped SPY, QQQ, META (>$500/share, untradeable
    # even at 0.30 notional cap on $2K account). 12 symbols remain.
    symbols:
      - NVDA
      - AAPL
      - MSFT
      - AMZN
      - TSLA
      - GOOGL
      - JPM
      - XOM
      - JNJ
      - WMT
      - BAC
      - PG

news_blackouts: []

backtest:
  start: '2021-06-12'
  end: '2026-06-12'
  initial_equity: 100000
  cache_dir: runtime/bars_cache

broker:
  paper_trading: true
  handshake_symbol: SPY

logging:
  level: INFO
  log_file: logs/cmf_equity_trader.log

overrides:
  path: runtime/wfo/active/live_overrides.yaml
  enabled: true
