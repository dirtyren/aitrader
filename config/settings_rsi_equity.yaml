system:
  name: rsi_equity_trader
  version: 2.0.0
  trading_env: paper
scheduler:
  bar_timeframe: 1Hour
  wake_grace_seconds: 5
  poll_fallback_seconds: 60
vwap:
  sigma_bands: 1.0
  min_session_bars: 6
acceptance:
  consecutive_closes: 2
  min_distance_atr: 0.25
regime_detector:
  trend_day_range_mult: 1.5
  trend_day_in_value_max: 0.3
  balance_day_in_value_min: 0.6
setups:
  rsi_reversion:
    # Tuned via docs/sweeps/2026-06-04 (russell-1000 sweep). Best combo by
    # symbols_above_floor + median_oos_sharpe + total_oos_pnl across the
    # curated universe below.
    # Prior values: threshold=40, stop_loss_pct=2.0, period=5.
    # 2026-07-20: threshold raised 40→45 to fix entry_never_filled (7/7 unreflected
    # trades since Jul 14 rebuild — 0% fill rate at threshold=40 during bull regime.
    # 5 trades at 19:00 ET (post-close ghost signals despite session_close=16:00
    # — suspect session-hour enforcement bug for 1Hour bars), 2 market-hour trades
    # (GLW 12:00) also unfilled. Iterative raise per heuristic: 30→35→40→45.
    # Prior: threshold=35→40 on 2026-07-14 (5/6 ENF). Jun 2 cycle: 35→40 (5/6 ENF).
    enabled: true
    threshold: 45
    direction: long
    stop_loss_pct: 2.5
    position_size_r: 0.5
    period: 5
risk:
  max_risk_per_trade: 0.005
  max_notional_per_trade_pct: 0.10
  max_concurrent_positions: 4
  max_daily_risk_open: 0.02
  consecutive_loss_limit: 2
  loss_filter_scope: per_symbol
filters:
  opening_blackout_min: 15
  volume_deficit_pct: 0.3
position_management:
  max_hold_bars: 24
  breakeven_at_R: 1.0
  trail_at_R: 1.5
  trail_atr: 1.0
asset_classes:
  equity:
    timezone: America/New_York
    # 2026-07-14: session_open changed from 00:00 to 09:30 — RSI signals
    # on pre-market bars (midnight-09:30 ET) were generating ghost entries
    # with entry_never_filled. Market hours only.
    session_open_local: '09:30'
    session_close_local: '16:00'
    slippage_bps: 2
    commission_per_share: 0.0
    # Curated from docs/sweeps/2026-06-04 (russell-1000 sweep). 19 symbols
    # surviving OOS Sharpe >= 0.3 AND >= 10 OOS trades. Previous universe
    # (SPY/QQQ/AAPL/MSFT/NVDA/...) had zero overlap with the survivors.
    symbols:
    - CSCO
    - STLD
    - PWR
    - WBA
    - AMAT
    - TGT
    - WAB
    - NUE
    - HPE
    - SQ
    - GLW
    - EQR
    - CTVA
    - GEV
    - JBHT
    - CSX
    - KEYS
    - HAL
    - CVX
news_blackouts: []
backtest:
  start: '2024-01-01'
  end: '2026-04-30'
  initial_equity: 100000
  cache_dir: runtime/bars_cache
broker:
  paper_trading: true
  handshake_symbol: SPY
logging:
  level: INFO
  log_file: logs/rsi_equity_trader.log
overrides:
  path: runtime/wfo/active/live_overrides.yaml
  enabled: true
