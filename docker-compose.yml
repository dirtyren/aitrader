  dashboard:
    build: .
    command: streamlit run ui/dashboard.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    env_file: ./config/.env
    environment:
      - STATE_FILE_PATH=/app/runtime/trading_state.json
      - PYTHONPATH=/app
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=trader
      - MYSQL_PASSWORD=traderpass
      - MYSQL_DATABASE=aitrader
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./logs:/app/logs
      - ./runtime:/app/runtime
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    build: ./nginx
    env_file: ./config/.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - dashboard_certs:/etc/nginx/certs
    restart: unless-stopped
    depends_on:
      - dashboard

volumes:
  dashboard_certs:
