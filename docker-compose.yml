services:
  mysql:
    image: mysql:8.0
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=aitrader
      - MYSQL_USER=trader
      - MYSQL_PASSWORD=traderpass
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./mysql:/var/lib/mysql
      - ./state/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  trader-vwap-wave-equity:
    build: .
    command: python main.py --config config/settings_vwap_wave_equity.yaml
    env_file: ./config/.env
    environment:
      - TRADING_ENV=${TRADING_ENV:-production}
      - LOCK_FILE_PATH=/app/runtime/lock_vwap_wave_eq.file
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=trader
      - MYSQL_PASSWORD=traderpass
      - MYSQL_DATABASE=aitrader
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./logs:/app/logs
      - ./runtime:/app/runtime
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  trader-vwap-wave-crypto:
