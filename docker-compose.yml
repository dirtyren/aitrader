services:
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=aitrader
      - MYSQL_USER=trader
      - MYSQL_PASSWORD=traderpass
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./state/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  trader:
    build: .
    command: python main.py
    env_file: ./config/.env
    environment:
      - TRADING_ENV=${TRADING_ENV:-production}
      - LOCK_FILE_PATH=/app/runtime/lock.file
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=trader
      - MYSQL_PASSWORD=traderpass
      - MYSQL_DATABASE=aitrader
    user: "${UID}:${GID}"
    volumes:
      - ./logs:/app/logs
      - ./runtime:/app/runtime
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  trader-rsi:
    build: .
    command: python main.py --config config/settings_rsi.yaml
    env_file: ./config/.env
    environment:
      - TRADING_ENV=${TRADING_ENV:-production}
      - LOCK_FILE_PATH=/app/runtime/lock_rsi.file
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=trader
      - MYSQL_PASSWORD=traderpass
      - MYSQL_DATABASE=aitrader
    user: "${UID}:${GID}"
    volumes:
      - ./logs:/app/logs
      - ./runtime:/app/runtime
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  trader-ib:
    build: .
    command: python main.py --config config/settings_ib.yaml
    env_file: ./config/.env
    environment:
      - TRADING_ENV=${TRADING_ENV:-production}
      - LOCK_FILE_PATH=/app/runtime/lock_ib.file
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=trader
      - MYSQL_PASSWORD=traderpass
      - MYSQL_DATABASE=aitrader
    user: "${UID}:${GID}"
    volumes:
      - ./logs:/app/logs
      - ./runtime:/app/runtime
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  trader-vwap-bands:
    build: .
    command: python main.py --config config/settings_vwap_bands.yaml
    env_file: ./config/.env
    environment:
      - TRADING_ENV=${TRADING_ENV:-production}
      - LOCK_FILE_PATH=/app/runtime/lock_vwap_bands.file
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=trader
      - MYSQL_PASSWORD=traderpass
      - MYSQL_DATABASE=aitrader
    user: "${UID}:${GID}"
    volumes:
      - ./logs:/app/logs
      - ./runtime:/app/runtime
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  trader-orb:
    build: .
    command: python main.py --config config/settings_orb.yaml
    env_file: ./config/.env
    environment:
      - TRADING_ENV=${TRADING_ENV:-production}
      - LOCK_FILE_PATH=/app/runtime/lock_orb.file
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=trader
      - MYSQL_PASSWORD=traderpass
      - MYSQL_DATABASE=aitrader
    user: "${UID}:${GID}"
    volumes:
      - ./logs:/app/logs
      - ./runtime:/app/runtime
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  dashboard:
    build: .
    command: streamlit run ui/dashboard.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    env_file: ./config/.env
    environment:
      - STATE_FILE_PATH=/app/runtime/trading_state.json
      - PYTHONPATH=/app
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=trader
      - MYSQL_PASSWORD=traderpass
      - MYSQL_DATABASE=aitrader
    user: "${UID}:${GID}"
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./logs:/app/logs
      - ./runtime:/app/runtime
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  db_data:
