services:
  trader:
    build: .
    command: python main.py
    env_file: ./config/.env
    environment:
      - TRADING_ENV=${TRADING_ENV:-production}
      - LOCK_FILE_PATH=/app/runtime/lock.file
    user: "${UID}:${GID}"
    volumes:
      - ./logs:/app/logs
      - ./runtime:/app/runtime
    restart: unless-stopped

  trader-rsi:
    build: .
    command: python main.py --config config/settings_rsi.yaml
    env_file: ./config/.env
    environment:
      - TRADING_ENV=${TRADING_ENV:-production}
      - LOCK_FILE_PATH=/app/runtime/lock_rsi.file
    user: "${UID}:${GID}"
    volumes:
      - ./logs:/app/logs
      - ./runtime:/app/runtime
    restart: unless-stopped

  dashboard:
    build: .
    command: streamlit run ui/dashboard.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    env_file: ./config/.env
    environment:
      - STATE_FILE_PATH=/app/runtime/trading_state.json
      - PYTHONPATH=/app
    user: "${UID}:${GID}"
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./logs:/app/logs
      - ./runtime:/app/runtime
    restart: unless-stopped
