services:
  trader:
    build: .
    command: python main.py
    env_file: .env
    environment:
      - TRADING_ENV=${TRADING_ENV:-production}
      - LOCK_FILE_PATH=/app/runtime/lock.file
    volumes:
      - ./logs:/app/logs
      - ./runtime:/app/runtime  # shared runtime state: lock.file, trading_state.json
    restart: unless-stopped

  dashboard:
    build: .
    command: streamlit run ui/dashboard.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    environment:
      - TRADING_ENV=test  # prevents lock.file import-time sys.exit
      - STATE_FILE_PATH=/app/runtime/trading_state.json
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
      - ./runtime:/app/runtime
    restart: unless-stopped
