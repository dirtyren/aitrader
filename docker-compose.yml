  reconciler-equity:
    build: .
    command: python -m reconciler.main
    env_file: ./config/.env
    environment:
      - TRADING_ENV=${TRADING_ENV:-production}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=trader
      - MYSQL_PASSWORD=traderpass
      - MYSQL_DATABASE=aitrader
      - RECONCILER_ASSET_CLASS=equity
      - RECONCILE_INTERVAL_S=${RECONCILE_INTERVAL_S:-30}
      - RECONCILE_STRIKE_THRESHOLD=${RECONCILE_STRIKE_THRESHOLD:-3}
      - RECONCILE_STRIKE_MIN_GAP_S=${RECONCILE_STRIKE_MIN_GAP_S:-60}
      - RECONCILE_QTY_EPS=${RECONCILE_QTY_EPS:-1e-6}
      - SHADOW_MODE=${SHADOW_MODE:-false}
      - RECONCILE_STATE_FILE=/app/runtime/reconciler_state_equity.json
      - RECONCILE_HEARTBEAT_STALE_AFTER_S=${RECONCILE_HEARTBEAT_STALE_AFTER_S:-300}
      - MANUAL_CLOSE_CONFIRM_CYCLES=${MANUAL_CLOSE_CONFIRM_CYCLES:-2}
      - MANUAL_CLOSE_COOLDOWN_MIN=${MANUAL_CLOSE_COOLDOWN_MIN:-60}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./logs:/app/logs
      - ./runtime:/app/runtime
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

